<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- vc_ brand mark.
     Composition: italic mathematical-script "𝓿𝓬" in off-white +
     geometric cursor-rect in gold acting as the trailing underscore.
     Final production export should convert 𝓿𝓬 to <path> elements
     ("Object to Path"), this file keeps the
     glyphs as text so the source stays editable. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" text-rendering="geometricPrecision" shape-rendering="geometricPrecision">
  <rect fill="#0e0e0e" width="1000" height="1000"/>

  <g transform="translate(-92.29, -86.8626) scale(0.5415, 0.6097) translate(22.8312, 21.4672)">
    <text
      fill="#f5f1e7"
      letter-spacing="-30"
      font-family="&#x27;Instrument Serif&#x27;, Georgia, serif"
      font-style="italic"
      font-size="620"
      font-weight="300"
      x="240"
      y="700"
      xml:space="preserve"
      style="white-space:pre"
    >𝓿𝓬</text>

    <!--     The cursor-underscore, residing in the same transform group as 𝓿𝓬,
	     scales uniformly with the wordmark. Positioned slightly after the
             optical end of 𝓬, it overlaps by approximately 10 user units,
             rendering it as a single glyph rather than an ornament.
             The y-coordinate is precisely below the baseline of 𝓬. The height
             and width are meticulously adjusted to emulate the appearance of
             a typographic underscore, preserving the crafted aesthetic. -->

<rect
      fill="#c99a3b"
      transform="translate(129.7207, 44.5754)"
      x="876"
      y="708"
      width="301"
      height="48.5"
      rx="6"
      ry="6"
    />
  </g>
</svg>
